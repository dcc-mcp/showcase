[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/asset-map.json,ui/FONT-LICENSE.txt,ui/FONT-SOURCE.json,notices/*.txt,notices/*.md,data/arpg.json,audio/AUDIO-SOURCES.json"
exclude_filter="addons/*,tests/*,README.md,PRODUCTION.md,required-settings.json"
export_path=""
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

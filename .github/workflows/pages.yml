name: Build site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Materialize mage VFX media
        run: git lfs pull --include="docs/showcase/godot-mage-vfx/*" --exclude=""

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Materialize pinned official Godot Web runtime
        run: python scripts/godot_web/materialize_runtime.py

      - name: Verify courier offline preflight refusals
        run: python scripts/character_animation/courier-rig-motion-comparison/test_preflight.py

      - name: Verify deferred Nuke build transactions without a host
        run: python scripts/nuke_desert_relay/test_build_nuke.py

      - name: Validate showcase entries
        run: python scripts/validate_entry.py docs/showcase

      - name: Verify collection publication guards
        run: python scripts/test_validate_collection.py

      - name: Verify explicit showcase publication decisions
        run: |
          python scripts/test_publication_intent.py
          python scripts/publication_intent.py

      - name: Validate selected collection and provenance
        run: python scripts/validate_collection.py

      - name: Verify brand asset publication guards
        run: python scripts/test_validate_brand_gallery.py

      - name: Validate selected brand gallery and rights
        run: python scripts/validate_brand_gallery.py

      - name: Verify authoritative brand manifest projection
        run: python scripts/test_brand_manifest.py

      - name: Verify brand gallery build integration
        run: python scripts/test_brand_build.py

      - name: Verify the build guards still bite
        run: python scripts/test_build_site.py

      - name: Verify localization and optional player guards
        run: |
          python scripts/test_localization.py
          python scripts/test_playable.py

      - name: Build the site
        run: python scripts/build_site.py

      - name: Upload Pages artifact
        # Draft PRs and branch builds verify only. A deployment is produced
        # from main alone, which is where the per-item publish gate lands.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

name: Prism Tide page acceptance
on:
  pull_request:
    paths:
      - 'docs/showcase/prism-tide/**'
      - 'collection.json'
      - 'scripts/prism_tide_page_smoke.py'
      - '.github/workflows/prism-tide-page.yml'
permissions:
  contents: read
jobs:
  prism-tide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked browser
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/browser-preview.lock
          python -m playwright install --with-deps chromium
      - name: Build and check Prism Tide page
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/build_site.py
          python scripts/prism_tide_page_smoke.py --site _site --output "${{ runner.temp }}/prism-tide-pages"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: prism-tide-page-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/prism-tide-pages
          retention-days: 7
          if-no-files-found: error

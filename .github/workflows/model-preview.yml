name: Model preview pilot
on:
  pull_request:
    paths:
      - 'assets/model-preview*'
      - 'assets/vendor/model-viewer/**'
      - 'benchmark/**'
      - 'scripts/*model_preview*'
      - 'scripts/benchmark_records.py'
      - 'scripts/build_site.py'
      - 'scripts/localization.py'
      - '.github/workflows/model-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer:
    name: Viewer controls (${{ matrix.asset }}, not production acceptance)
    strategy:
      fail-fast: false
      matrix:
        asset: [software-fixture, mcp-rebuilt-ember]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/test_model_previews.py
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/browser-preview.lock
      - run: google-chrome --version
      - name: Prepare pinned MCP-rebuilt original asset (all rights reserved)
        if: matrix.asset == 'mcp-rebuilt-ember'
        run: |
          mkdir -p "$RUNNER_TEMP/viewer-input"
          curl --fail --location --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/dcc-mcp/showcase/0523c285ddc66d14a5ff370be704a853c7695141/scripts/godot_web/dawnkeep/art/ecosystem-rebuild/assets/tower_ember.glb' -o "$RUNNER_TEMP/viewer-input/asset.glb"
          curl --fail --location --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/dcc-mcp/showcase/0523c285ddc66d14a5ff370be704a853c7695141/scripts/godot_web/dawnkeep/LICENSES.md' -o "$RUNNER_TEMP/viewer-input/LICENSES.md"
          python scripts/model_preview_pilot.py --asset "$RUNNER_TEMP/viewer-input/asset.glb" --sha256 3f6c60b807ff91d7c842caf1d10b898e02ecfeb0b111e6571574f3bd88a05b37 --license "$RUNNER_TEMP/viewer-input/LICENSES.md"
      - name: Test controls on the pinned MCP-rebuilt asset, not whole-case acceptance
        if: matrix.asset == 'mcp-rebuilt-ember'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/model_preview_browser_smoke.py --output "${{ runner.temp }}/viewer-qa"
      - name: Test controls on a synthetic software fixture, never production evidence
        if: matrix.asset == 'software-fixture'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/model_preview_browser_smoke.py --test-fixture --output "${{ runner.temp }}/viewer-qa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: model-viewer-${{ matrix.asset }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/viewer-qa
          if-no-files-found: warn
          retention-days: 7

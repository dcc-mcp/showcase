name: Original minigames acceptance
on:
  pull_request:
    paths: ['scripts/godot_web/minigames/**', 'play/minigame-shell.*', '.github/workflows/minigames-preview.yml']
  workflow_dispatch:
concurrency:
  group: minigames-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  signal-garden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install media validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version
          ffprobe -version
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Test media duration metadata and streaming fallback
        run: python -m unittest discover -s scripts/godot_web/minigames -p 'test_*.py'
      - name: Install pinned official host, adapter and browser test tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'dcc-mcp-godot==0.9.6' 'dcc-mcp-core==0.20.42'
          python -m pip install --require-hashes --only-binary=:all: -r requirements/browser-preview.lock
          python -m playwright install --with-deps chromium
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          python scripts/godot_web/fetch_templates.py --output "$RUNNER_TEMP/templates"
      - name: Create, save, restart and reopen in real Godot through typed MCP
        run: xvfb-run -a python scripts/godot_web/minigames/author_native.py --godot Godot_v4.6.3-stable_linux.x86_64 --output "$RUNNER_TEMP/minigame-native"
      - name: Validate game logic and make official Web export
        run: python scripts/godot_web/minigames/export_candidate.py --godot Godot_v4.6.3-stable_linux.x86_64 --native "$RUNNER_TEMP/minigame-native/native/signal-garden" --template "$RUNNER_TEMP/templates/web_nothreads_release.zip" --output "$RUNNER_TEMP/minigame-site"
      - name: Verify the self-contained downloadable candidate
        run: python scripts/godot_web/minigames/verify_candidate.py --site "$RUNNER_TEMP/minigame-site"
      - name: Real browser input, audio, three gardens, mobile and recovery
        run: python scripts/godot_web/minigames/browser_candidate.py --site "$RUNNER_TEMP/minigame-site" --output "$RUNNER_TEMP/minigame-evidence"
      - name: Encode and fully decode real audiovisual previews
        run: python scripts/godot_web/minigames/verify_media.py --evidence "$RUNNER_TEMP/minigame-evidence"
      - name: Preserve reviewable candidates and full interaction videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signal-garden-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/minigame-native/authoring.json
            ${{ runner.temp }}/minigame-native/native-input.json
            ${{ runner.temp }}/minigame-native/native-game.png
            ${{ runner.temp }}/minigame-native/editor.log
            ${{ runner.temp }}/minigame-native/mcp-raw.json
            ${{ runner.temp }}/minigame-native/native
            ${{ runner.temp }}/minigame-site/export.json
            ${{ runner.temp }}/minigame-site/README.txt
            ${{ runner.temp }}/minigame-site/play
            ${{ runner.temp }}/minigame-evidence

name: Showcase production skill

on:
  pull_request:
    paths:
      - 'skills/dcc-showcase-production/**'
      - 'scripts/test_production_skill.py'
      - '.github/workflows/production-skill.yml'
      - 'collection.json'
      - 'docs/showcase/prism-tide/**'
      - 'docs/showcase/crate-lookdev/**'
      - 'play/manifest.json'
  push:
    branches: [main]
    paths:
      - 'skills/dcc-showcase-production/**'
      - 'scripts/test_production_skill.py'
      - '.github/workflows/production-skill.yml'
      - 'collection.json'
      - 'docs/showcase/prism-tide/**'
      - 'docs/showcase/crate-lookdev/**'
      - 'play/manifest.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require real media decoders
        run: |
          command -v ffprobe
          command -v ffmpeg
      - name: Test evidence boundaries and real repository media
        run: python scripts/test_production_skill.py

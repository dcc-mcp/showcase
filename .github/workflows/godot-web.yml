name: Godot Web acceptance
on:
  pull_request:
    paths: ['play/**', 'scripts/godot_web/**', 'scripts/playable.py', 'assets/playable.js', '.github/workflows/godot-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check explicit asset inventory and build
        run: |
          python scripts/godot_web/test_materialize_runtime.py
          python scripts/godot_web/materialize_runtime.py
          python scripts/test_playable.py
          python scripts/godot_web/verify_export.py
          python scripts/build_site.py
      - name: Install pinned browser testing dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/browser-preview.lock
          python -m playwright install --with-deps chromium
      - name: Exercise real Godot WASM, input, audio, saves, touch and iframe
        run: python scripts/godot_web/browser_test.py --site _site --output "${{ runner.temp }}/godot-web-evidence"
      - name: Retain screenshots, interaction videos and JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-web-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/godot-web-evidence
          if-no-files-found: warn
          retention-days: 14

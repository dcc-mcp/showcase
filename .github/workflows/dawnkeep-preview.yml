name: Dawnkeep original hero-defense acceptance
on:
  pull_request:
    paths:
      - 'scripts/godot_web/dawnkeep/**'
      - '.github/workflows/dawnkeep-preview.yml'
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: 'After the native gate: full eight-wave victory, natural defeat/restart, and actual audiovisual recording'
        type: boolean
        default: false
concurrency:
  group: dawnkeep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-and-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RECIPE: scripts/godot_web/dawnkeep
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      FULL_ACCEPTANCE: ${{ inputs.full_acceptance && 'true' || 'false' }}
      PULSE_SINK: dawnkeep
      PULSE_SOURCE: dawnkeep.monitor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official distro X11, software renderer and media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth xdotool ffmpeg libgl1-mesa-dri mesa-vulkan-drivers fonts-dejavu-core fonts-noto-cjk pulseaudio pulseaudio-utils
      - name: Install hash-pinned official typed adapter and Chromium
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r "$RECIPE/ci/requirements-dcc.lock"
          python -m pip install --require-hashes --only-binary=:all: -r requirements/browser-preview.lock
          python -m playwright install --with-deps chromium
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/dawnkeep-godot.zip"
          echo "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  $RUNNER_TEMP/dawnkeep-godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dawnkeep-godot.zip" -d "$RUNNER_TEMP/dawnkeep-godot"
          echo "$RUNNER_TEMP/dawnkeep-godot" >> "$GITHUB_PATH"
      - name: Validate acceptance guards
        run: |
          python -m unittest discover -s "$RECIPE/ci" -p 'test_*.py' -v
          node "$RECIPE/ci/test_web_shell.js"
      - name: Actual headless typed MCP create, validate, save, restart and reopen
        id: author
        run: |
          set -euo pipefail
          python "$RECIPE/ci/author_native.py" --headless \
            --source "$RECIPE/game" --godot Godot_v4.6.3-stable_linux.x86_64 --output "$RUNNER_TEMP/dawnkeep-author"
      - name: Exact-source mechanics, bilingual layout and runtime integration
        run: |
          python "$RECIPE/ci/verify_headless.py" --source "$RUNNER_TEMP/dawnkeep-author/native" \
            --godot Godot_v4.6.3-stable_linux.x86_64 --output "$RUNNER_TEMP/dawnkeep-headless"
      - name: Fast actual native input and image gate
        id: native_gate
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' python "$RECIPE/ci/capture_native.py" \
            --native "$RUNNER_TEMP/dawnkeep-author/native" --godot Godot_v4.6.3-stable_linux.x86_64 --output "$RUNNER_TEMP/dawnkeep-native-preview"
      - name: Upload early actual native frames before any long capture
        if: ${{ !cancelled() && steps.author.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dawnkeep-native-preview-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dawnkeep-native-preview/*.png
            ${{ runner.temp }}/dawnkeep-native-preview/*.json
            ${{ runner.temp }}/dawnkeep-native-preview/*.log
      - name: Start task-only audio sink for requested full capture
        if: ${{ env.FULL_ACCEPTANCE == 'true' && steps.native_gate.outcome == 'success' }}
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dawnkeep sink_properties=device.description=DawnkeepAcceptance
          pactl set-default-sink dawnkeep
          pactl set-default-source dawnkeep.monitor
      - name: Longer real native combat and audiovisual capture
        if: ${{ env.FULL_ACCEPTANCE == 'true' && steps.native_gate.outcome == 'success' }}
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' python "$RECIPE/ci/capture_native.py" --full \
            --native "$RUNNER_TEMP/dawnkeep-author/native" --godot Godot_v4.6.3-stable_linux.x86_64 --output "$RUNNER_TEMP/dawnkeep-native-full"
      - name: Fetch hash-verified official single-thread Web templates
        id: templates
        if: ${{ !cancelled() && steps.native_gate.outcome == 'success' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/godot_web/fetch_templates.py --output "$RUNNER_TEMP/dawnkeep-templates"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          exit 1
      - name: Export actual official Godot Web
        id: export
        if: ${{ !cancelled() && steps.templates.outcome == 'success' }}
        run: |
          python "$RECIPE/ci/export_web.py" --native "$RUNNER_TEMP/dawnkeep-author/native" \
            --godot Godot_v4.6.3-stable_linux.x86_64 --template "$RUNNER_TEMP/dawnkeep-templates/web_nothreads_release.zip" \
            --license-dir play/runtime --output "$RUNNER_TEMP/dawnkeep-web"
      - name: Actual Chromium desktop and portrait EN/ZH input and lifecycle
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$FULL_ACCEPTANCE" = 'true' ]; then extra+=(--full); fi
          python "$RECIPE/ci/capture_browser.py" --site "$RUNNER_TEMP/dawnkeep-web/site" --output "$RUNNER_TEMP/dawnkeep-browser" "${extra[@]}"
      - name: Verify tracked recipe remains unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- "$RECIPE" .github/workflows/dawnkeep-preview.yml
      - name: Preserve unpublished source, receipts and real runtime evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dawnkeep-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dawnkeep-author/authoring.json
            ${{ runner.temp }}/dawnkeep-author/*manifest.json
            ${{ runner.temp }}/dawnkeep-author/mcp-*.json
            ${{ runner.temp }}/dawnkeep-author/editor.log
            ${{ runner.temp }}/dawnkeep-author/native
            ${{ runner.temp }}/dawnkeep-headless/*.json
            ${{ runner.temp }}/dawnkeep-headless/*.log
            ${{ runner.temp }}/dawnkeep-native-preview/*.json
            ${{ runner.temp }}/dawnkeep-native-preview/*.log
            ${{ runner.temp }}/dawnkeep-native-preview/*.png
            ${{ runner.temp }}/dawnkeep-native-full/*.json
            ${{ runner.temp }}/dawnkeep-native-full/*.log
            ${{ runner.temp }}/dawnkeep-native-full/*.png
            ${{ runner.temp }}/dawnkeep-native-full/*.mp4
            ${{ runner.temp }}/dawnkeep-native-full/*.wav
            ${{ runner.temp }}/dawnkeep-web/export.json
            ${{ runner.temp }}/dawnkeep-web/*.log
            ${{ runner.temp }}/dawnkeep-web/site
            ${{ runner.temp }}/dawnkeep-browser
            ${{ runner.temp }}/dawnkeep-templates/provenance.json

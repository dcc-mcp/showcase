name: Gallery preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    name: Artwork gallery browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify gallery and catalog contracts
        run: |
          python scripts/test_gallery.py
          python scripts/test_agent_pages.py
          python scripts/test_games.py
          node scripts/test_preview_controls.js
          node scripts/test_detail_video_controls.js
      - name: Install locked browser driver
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/browser-preview.lock
      - name: Install official Chromium
        run: python -m playwright install --with-deps chromium
      - name: Materialize pinned official Godot runtime
        run: python scripts/godot_web/materialize_runtime.py
      - name: Build exact candidate
        run: python scripts/build_site.py
      - name: Verify gallery interactions and responsive layouts
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/gallery_browser_smoke.py --site _site --output "${{ runner.temp }}/gallery-preview" --expected-head "$EXPECTED_HEAD_SHA"
      - name: Verify every gallery and result video hover
        run: python scripts/video_browser_smoke.py --site _site --output "${{ runner.temp }}/gallery-preview/videos"
      - name: Verify playable stages and preview sound
        run: python scripts/games_browser_smoke.py --site _site --output "${{ runner.temp }}/gallery-preview/games"
      - name: Verify native reflow, viewport, zoom and fullscreen
        run: python scripts/responsive_games_browser.py --site _site --output "${{ runner.temp }}/gallery-preview/responsive"
      - name: Keep public screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/gallery-preview
          if-no-files-found: error
          retention-days: 7

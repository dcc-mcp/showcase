name: Dawnkeep public-page acceptance
on:
  pull_request:
    paths:
      - 'docs/showcase/dawnkeep-defense/**'
      - 'locales/**'
      - 'collection.json'
      - 'play/**'
      - 'assets/**'
      - 'scripts/build_site.py'
      - 'scripts/games.py'
      - 'scripts/playable.py'
      - 'scripts/asset_versions.py'
      - 'scripts/localization.py'
      - 'scripts/godot_web/dawnkeep/ci/**'
      - 'requirements/browser-preview.lock'
      - '.github/workflows/dawnkeep-public-page.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full main commit SHA already successfully deployed by the Build site workflow'
        required: true
        type: string
      base_url:
        description: 'Official deployed Pages origin (the acceptance script rejects any other URL)'
        required: true
        default: 'https://dcc-mcp.github.io/showcase/'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: dawnkeep-public-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RECIPE: scripts/godot_web/dawnkeep/ci
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate exact source and preinstalled sandbox-capable Chrome
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          CHROME=/opt/google/chrome/chrome
          test -f "$CHROME" && test -x "$CHROME"
          test "$(readlink -f "$CHROME")" = "$CHROME"
          "$CHROME" --version
      - name: Install hash-pinned browser client and official media tools
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r requirements/browser-preview.lock
          python -m playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Validate public-page acceptance guards
        run: python -m unittest discover -s "$RECIPE" -p 'test_public_page.py' -v
      - name: Verify completed Pages deployment for the requested source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs" \
            -f head_sha="$EXPECTED_HEAD_SHA" -f status=success -f per_page=100 > "$RUNNER_TEMP/dawnkeep-pages-runs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'dawnkeep-pages-runs.json'
          runs = json.loads(source.read_text())['workflow_runs']
          matches = [r for r in runs if r['head_sha'] == os.environ['EXPECTED_HEAD_SHA']
                     and r['head_branch'] == 'main' and r['status'] == 'completed'
                     and r['conclusion'] == 'success' and r['event'] in ('push', 'workflow_dispatch')]
          if not matches:
              raise SystemExit('No completed successful main Pages deployment matches the requested source SHA')
          result = {k: matches[0][k] for k in ('id', 'html_url', 'head_sha', 'head_branch', 'event', 'status', 'conclusion')}
          (Path(os.environ['RUNNER_TEMP']) / 'dawnkeep-pages-deployment.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Build an isolated exact-head site for pull-request acceptance
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dawnkeep-public-source"
          git archive "$EXPECTED_HEAD_SHA" | tar -x -C "$RUNNER_TEMP/dawnkeep-public-source"
          cd "$RUNNER_TEMP/dawnkeep-public-source"
          python scripts/godot_web/materialize_runtime.py
          python scripts/build_site.py
      - name: Accept isolated public pages, media and embedded native UI
        if: github.event_name == 'pull_request'
        run: |
          python "$RECIPE/public_page.py" --repo "$GITHUB_WORKSPACE" \
            --site "$RUNNER_TEMP/dawnkeep-public-source/_site" \
            --output "$RUNNER_TEMP/dawnkeep-public-result"
      - name: Accept the actual deployed pages without rebuilding or re-exporting
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLIC_BASE_URL: ${{ inputs.base_url }}
        run: |
          python "$RECIPE/public_page.py" --repo "$GITHUB_WORKSPACE" \
            --base-url "$PUBLIC_BASE_URL" --output "$RUNNER_TEMP/dawnkeep-public-result"
      - name: Preserve source-bound publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dawnkeep-public-${{ github.event.pull_request.head.sha || inputs.source_sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dawnkeep-public-result
            ${{ runner.temp }}/dawnkeep-pages-deployment.json
